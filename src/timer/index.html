<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Pomo</title>
<link rel="stylesheet" href="../characters/otter.css">
<link rel="stylesheet" href="../characters/cat.css">
<link rel="stylesheet" href="../characters/panda.css">
<link rel="stylesheet" href="../pet/pet.css">
<link rel="stylesheet" href="timer.css">
</head>
<body data-phase="focus">
<div class="card">
  <header>
    <span class="brand">pomo<small id="ver"></small></span>
    <button id="swap" aria-label="Switch character"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button>
    <button id="roam" title="Where your buddy lives: whole screen, inside this window, or hidden"></button>
    <span class="win">
      <button id="gear" title="Settings" aria-label="Settings">⚙</button>
      <button id="min" title="Minimize" aria-label="Minimize">–</button>
      <button id="max" title="Maximize" aria-label="Maximize">□</button>
      <button id="close" title="Close" aria-label="Close">×</button>
    </span>
  </header>
  <div id="charMenu" role="menu" hidden></div>

  <main id="main">
    <button id="update" hidden></button>
    <nav class="tabs">
      <button data-phase="focus">Focus</button>
      <button data-phase="short">Short break</button>
      <button data-phase="long">Long break</button>
    </nav>

    <div class="ring">
      <svg viewBox="0 0 200 200">
        <circle class="track" cx="100" cy="100" r="90"/>
        <circle class="prog" id="prog" cx="100" cy="100" r="90"/>
      </svg>
      <div class="center">
        <div class="mini" id="mini"></div>
        <div class="time" id="time">25:00</div>
        <div class="label" id="label">ready when you are</div>
      </div>
    </div>

    <div class="dots" id="dots"></div>

    <div class="controls">
      <button class="ghost" id="reset" title="Reset">↺</button>
      <button class="primary" id="toggle">Start</button>
      <button class="ghost" id="skip" title="Skip">⏭</button>
    </div>

    <div class="music">
      <button id="spot">🎧 Spotify</button>
    </div>
    <div class="msg" id="msg"></div>

    <div class="todo">
      <div class="todo-head">
        <span id="todoCount">To do</span>
        <button id="clearDone" hidden>clear done</button>
      </div>
      <input type="text" id="newTask" placeholder="Add a task and press Enter" maxlength="140" spellcheck="false">
      <ul id="tasks"></ul>
    </div>
  </main>

  <section id="settings" hidden>
    <h3>Timer</h3>
    <label class="row">Focus <span><input type="number" id="focusMin" min="1" max="180"> min</span></label>
    <label class="row">Short break <span><input type="number" id="shortMin" min="1" max="60"> min</span></label>
    <label class="row">Long break <span><input type="number" id="longMin" min="1" max="120"> min</span></label>
    <label class="row">Long break every <span><input type="number" id="longEvery" min="2" max="12"> rounds</span></label>
    <label class="row">Start next round by itself <input type="checkbox" id="autoStart"></label>
    <label class="row">Alarm sound when a round ends <input type="checkbox" id="alarmSound"></label>
    <label class="row">Character size <input type="range" id="petScale" min="0.5" max="2.5" step="0.1"></label>

    <h3>Music</h3>
    <label class="row">Keep music on during breaks <input type="checkbox" id="musicOnBreaks"></label>
    <label class="col">Spotify Client ID
      <input type="text" id="spotifyClientId" placeholder="from developer.spotify.com" spellcheck="false">
    </label>
    <label class="col">Focus playlist link (optional)
      <input type="text" id="spotifyPlaylist" placeholder="https://open.spotify.com/playlist/..." spellcheck="false">
    </label>
    <button class="wide" id="spotConnect">Connect Spotify</button>
    <h3>About</h3>
    <div class="row"><span id="verLong">Pomo</span> <button class="link" id="checkUpdates">Check for updates</button></div>
    <div class="status" id="updateStatus"></div>
    <button class="wide primary" id="done">Done</button>
  </section>
</div>
<div id="pet"><div id="flip"></div></div>
<div id="bubble"></div>
<script src="../characters/otter.js"></script>
<script src="../characters/cat.js"></script>
<script src="../characters/panda.js"></script>
<script src="timer.js"></script>
<script src="../pet/pet.js"></script>
</body>
</html>
